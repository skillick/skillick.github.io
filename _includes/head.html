{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  /* Dark theme by default, unless the visitor has chosen light. (Block comment: pages are minified onto one line.) */
  try { if (localStorage.getItem("theme") !== "light") document.documentElement.setAttribute("data-theme", "dark"); }
  catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
